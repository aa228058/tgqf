name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "deploy/**"
      - ".env.example"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
      - "frontend/**"
    paths:
      - "frontend/**"
      - "backend/**"
      - "deploy/**"
      - ".env.example"
      - ".github/workflows/frontend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Validate deployment shell scripts
        run: |
          bash -n ../deploy/*.sh
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning ../deploy/*.sh
      - name: Check patch whitespace
        run: git diff --check
      - run: npm run build
      - name: Validate production Compose and build release images
        working-directory: .
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose --env-file .env -f deploy/compose.yaml config --quiet
          docker compose --env-file .env -f deploy/compose.yaml build
