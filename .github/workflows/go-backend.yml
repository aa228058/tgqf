name: Go backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/go-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/go-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Resolve modules
        working-directory: backend
        run: go mod tidy
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build API
        working-directory: backend
        run: |
          go build -o /tmp/tgqf-api ./cmd/api
          go build -o /tmp/tgqf-worker ./cmd/worker
