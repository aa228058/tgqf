name: Go backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/go-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/go-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tgqf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tgqf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tgqf_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Check formatting of newly added Go files
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            go_files="$(git diff --name-only --diff-filter=A "origin/$GITHUB_BASE_REF...HEAD" -- '*.go')"
          else
            go_files="$(git diff-tree --no-commit-id --name-only -r HEAD --diff-filter=A -- '*.go')"
          fi
          if [[ -n "$go_files" ]]; then
            unformatted="$(printf '%s\n' "$go_files" | xargs -r gofmt -l)"
            if [[ -n "$unformatted" ]]; then
              printf 'New Go files need gofmt:\n%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Resolve modules
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build API
        working-directory: backend
        run: |
          go build -o /tmp/tgqf-api ./cmd/api
          go build -o /tmp/tgqf-worker ./cmd/worker
