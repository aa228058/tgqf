name: Go backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/go-backend.yml"
      - "docs/PHASE3_QUALITY_GATES.md"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/go-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tgqf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tgqf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tgqf_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Resolve modules
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check Go formatting
        working-directory: backend
        run: |
          files="$(gofmt -l $(find . -name '*.go' -type f))"
          if [[ -n "$files" ]]; then
            echo "The following Go files are not gofmt-formatted:"
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build API
        working-directory: backend
        run: |
          go build -o /tmp/tgqf-api ./cmd/api
          go build -o /tmp/tgqf-worker ./cmd/worker
