name: One-time Phase 3 formatting
on:
  push:
    branches:
      - release/phase3-final-gates
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Format and commit Go sources
        working-directory: backend
        run: |
          mapfile -d '' files < <(find . -type f -name '*.go' -print0)
          if ((${#files[@]})); then gofmt -w "${files[@]}"; fi
          rm -f ../.github/workflows/format-phase3-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No formatting changes required."; exit 0; fi
          git commit -m "chore: format phase 3 quality gate changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
