name: One-time Go formatting repair
on:
  push:
    branches:
      - format/phase3-gofmt
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Format Go sources and remove one-time helper
        working-directory: backend
        run: |
          mapfile -d '' files < <(find . -type f -name '*.go' -print0)
          if ((${#files[@]})); then gofmt -w "${files[@]}"; fi
          rm -f ../.github/workflows/format-once.yml
      - name: Commit formatted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes were necessary."
            exit 0
          fi
          git commit -m "chore: apply gofmt to backend sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
