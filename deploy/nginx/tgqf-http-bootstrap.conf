# Temporary HTTP-only site for ACME HTTP-01 certificate issuance.
# Replace example.com, enable this file, then run certbot --webroot.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 200 "TGQF certificate bootstrap is ready\n";
        add_header Content-Type text/plain;
    }
}
